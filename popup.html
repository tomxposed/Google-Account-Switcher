<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Account Switcher</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="header-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" />
        <path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </div>
    <div>
      <h1 class="header-title">Account Switcher</h1>
      <p class="header-subtitle">Set default accounts per Google service</p>
    </div>
  </header>

  <!-- Global default -->
  <section class="global-section">
    <label class="global-label" for="default-account">
      <span class="label-text">Global Default Account</span>
      <span class="label-hint">Used when a service has no specific setting</span>
    </label>
    <select id="default-account" class="account-select global-select" data-service="_default">
      <option value="">— Disabled —</option>
    </select>
    <p id="accounts-status" class="label-hint accounts-status"></p>
  </section>

  <div class="divider"></div>

  <!-- Service cards -->
  <section class="services" id="services-list">
    <!-- Cards are injected by popup.js -->
  </section>

  <!-- Footer actions -->
  <footer class="footer">
    <button id="save-btn" class="btn-save">Save Settings</button>
    <span id="toast" class="toast hidden">✓ Saved!</span>
  </footer>

  <script src="popup.js"></script>
</body>

</html>
